services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: assessment3-backend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}

    volumes:
      - backend_sqlite:/app/sqlite

    restart: unless-stopped


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder

    container_name: assessment3-migrate

    environment:
      NODE_ENV: development

    volumes:
      - backend_sqlite:/app/sqlite

    command:
      [
        "npx",
        "sequelize-cli",
        "db:migrate",
        "--env",
        "development"
      ]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: assessment3-frontend

    ports:
      - "3001:3000"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  backend_sqlite: